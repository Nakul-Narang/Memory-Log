kind = "web"
previewPath = "/"
title = "Travel Journal"
description = "A personal travel journal for recording visited places with rich notes, visit dates, photo galleries, and optional Google Photos album links."
version = "1.0.0"
id = "artifacts/travel-journal"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21666

[services.development]
run = "pnpm --filter @workspace/travel-journal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/travel-journal", "run", "build" ]
serve = "static"
publicDir = "artifacts/travel-journal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21666"
BASE_PATH = "/"
